version: '3.8'

services:
  dermai-scan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dermai-scan
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
